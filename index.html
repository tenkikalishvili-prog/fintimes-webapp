<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0d12" />
    <title>Financial Times — Финансы</title>
    <!-- Шрифт стиля UNFIN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <!-- Официальный скрипт Telegram: заполняет window.Telegram.WebApp.initData
         из параметров запуска Mini App. Должен грузиться ДО приложения. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Ранний разворот на РЕАЛЬНОМ объекте Telegram, синхронно сразу после
         официального скрипта — ДО того как @twa-dev/sdk перезапишет
         window.Telegram.WebApp своим бандлом. Это гарантирует, что expand()
         и полный экран уходят на объект, реально связанный с хостом.
         initTelegram() в приложении дублирует эти вызовы (идемпотентны). -->
    <script>
      (function () {
        try {
          var wa = window.Telegram && window.Telegram.WebApp;
          if (!wa) return;
          var atLeast = function (v) {
            try { return wa.isVersionAtLeast && wa.isVersionAtLeast(v); } catch (e) { return false; }
          };
          wa.ready();
          // Сохраняем РЕАЛЬНЫЙ объект A и флаг поддержки «на экран Домой» (8.0+) ДО
          // того, как @twa-dev/sdk перезапишет window.Telegram.WebApp своим бандлом B
          // (у B версия иногда сваливается в дефолт). Приложение берёт их как резерв.
          window.__ftTgReal = wa;
          window.__ftHomeOK = atLeast('8.0');
          // Полная высота (все клиенты с Bot API 6.0) — убирает «шторку» на пол-экрана.
          if (wa.expand) wa.expand();
          // Свайп вниз больше не сворачивает (Bot API 7.7+).
          if (atLeast('7.7') && wa.disableVerticalSwipes) wa.disableVerticalSwipes();
          // Полный экран edge-to-edge (Bot API 8.0+). Ранний вызов клиент иногда
          // отбрасывает — поэтому ещё раз на следующем кадре.
          var goFull = function () {
            try {
              if (atLeast('8.0') && wa.requestFullscreen && !wa.isFullscreen) wa.requestFullscreen();
            } catch (e) {}
          };
          goFull();
          if (window.requestAnimationFrame) requestAnimationFrame(goFull);
          setTimeout(goFull, 200);
        } catch (e) { /* вне Telegram — тихо игнорируем */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
